<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - UNICAFE</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        font-family: Arial, sans-serif;

        background: #f7f7f7;

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-container {
        width: 400px;

        background: white;

        padding: 35px;

        border-radius: 15px;

        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      .logo {
        text-align: center;

        font-size: 30px;

        font-weight: bold;

        margin-bottom: 5px;
      }

      .subtitle {
        text-align: center;

        color: #777;

        margin-bottom: 30px;
      }

      form p {
        margin-bottom: 15px;
      }

      label {
        display: block;

        margin-bottom: 6px;

        font-weight: bold;
      }

      input {
        width: 100%;

        padding: 12px;

        border: 1px solid #ddd;

        border-radius: 8px;
      }

      input:focus {
        outline: none;

        border-color: #555;
      }

      .login-btn {
        width: 100%;

        padding: 12px;

        border: none;

        border-radius: 8px;

        background: #222;

        color: white;

        font-size: 16px;

        cursor: pointer;
      }

      .login-btn:hover {
        background: #444;
      }

      .register-link {
        text-align: center;

        margin-top: 20px;
      }

      .register-link a {
        color: #222;

        font-weight: bold;

        text-decoration: none;
      }

      .errorlist {
        color: #d00;

        font-size: 13px;

        padding-left: 20px;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="logo">UNICAFE</div>

      <p class="subtitle">Welcome back</p>

      {% if form.errors %}
      <p style="color: red; text-align: center">
        Invalid username or password.
      </p>
      {% endif %}

      <form method="POST">
        {% csrf_token %} {{ form.as_p }}

        <button type="submit" class="login-btn">Login</button>
      </form>

      <div class="register-link">
        Don't have an account?

        <a href="{% url 'users:register' %}"> Register </a>
      </div>
    </div>
  </body>
</html>
