<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register - UNICAFE</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f7f7;

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;
      }

      .register-container {
        width: 420px;
        background: white;

        padding: 35px;

        border-radius: 15px;

        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      .register-container h1 {
        text-align: center;
        margin-bottom: 10px;
      }

      .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
      }

      form p {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 12px;

        border: 1px solid #ddd;
        border-radius: 8px;

        font-size: 14px;
      }

      input:focus {
        outline: none;
        border-color: #555;
      }

      .register-btn {
        width: 100%;

        padding: 12px;

        border: none;
        border-radius: 8px;

        background: #222;
        color: white;

        font-size: 16px;
        cursor: pointer;
      }

      .register-btn:hover {
        background: #444;
      }

      .login-link {
        text-align: center;
        margin-top: 20px;
      }

      .login-link a {
        color: #222;
        font-weight: bold;
        text-decoration: none;
      }

      .helptext {
        font-size: 12px;
        color: #777;
      }

      .errorlist {
        color: #d00;
        font-size: 13px;
        padding-left: 20px;
      }
    </style>
  </head>

  <body>
    <div class="register-container">
      <h1>Create Account</h1>

      <p class="subtitle">Join UNICAFE today</p>

      <form method="POST">
        {% csrf_token %} {{ form.as_p }}

        <button type="submit" class="register-btn">Register</button>
      </form>

      <div class="login-link">
        Already have an account?
        <a href="{% url 'users:login' %}"> Login </a>
      </div>
    </div>
  </body>
</html>
